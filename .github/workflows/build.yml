name: Verify release tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.14.1

      - name: Use Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Verify release tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p \"require('./package.json').version\")"

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Core tests
        run: pnpm run test:core

      - name: Extension tests
        run: pnpm run test:extension

      - name: Build release artifact
        run: pnpm run release:build
