<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Exporter</title>
    <style>
      :root { color-scheme: light dark; }
      body { min-width: 240px; margin: 0; padding: 16px; font: 14px system-ui, sans-serif; }
      h1 { margin: 0 0 12px; font-size: 16px; }
      p { margin: 0 0 12px; line-height: 1.4; }
      button { width: 100%; padding: 8px 10px; cursor: pointer; }
      #status { margin-top: 10px; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <h1>ChatGPT Exporter</h1>
    <p>v0.6 HTTP-Destination</p>
    <button id="download" type="button">Aktuellen Chat herunterladen</button>
    <label for="endpoint">HTTP-Endpoint</label>
    <input id="endpoint" type="url" placeholder="https://example.test/captures" />
    <button id="save-endpoint" type="button">Endpoint speichern</button>
    <button id="test-endpoint" type="button">Endpoint testen</button>
    <button id="send-endpoint" type="button">Aktuellen Chat senden</button>
    <button id="ping" type="button">Verbindung testen</button>
    <p id="status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
